<section scrollListener="skills" id="skills">
  <div class="row skills-text">
    <h2>SkillsSkillsSkillsSkillsSkillsSkillsSkillsSkillsSkills</h2>
  </div>
  <div class="scroll-container center">
    <div class="row-container">
      @for (box of rows; track box; let i = $index) {
      <div class="card-container row center">
        <div
          class="card column center"
          *ngFor="let box of boxes; index as j"
          [style.backgroundColor]="
            skills[10 * i + j]?.color || 'var(--deep-blue)'
          "
        >
          <ng-container *ngIf="skills[10 * i + j]">
            <img
              [src]="'./assets/svg/' + skills[10 * i + j]?.link"
              (load)="onLoad($event)"
            />
            <h3>{{ skills[10 * i + j]?.name }}</h3>
            <div class="item">
              <span *ngFor="let item of skills[10 * i + j]?.items">
                {{ item }}
              </span>
            </div>
            <span
              *ngFor="let lang of skills[10 * i + j]?.langs"
              [style.color]="lang.color"
            >
              <img
                [src]="'./assets/svg/' + lang.link"
                (load)="onLoad($event)"
              />
              {{ lang.name }}
            </span>
          </ng-container>
        </div>
      </div>
      }
    </div>
  </div>
</section>
